<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทดสอบเสียงแจ้งเตือน — ร้านพี่ใหญ่</title><style>body{font-family:system-ui,'Noto Sans Thai',sans-serif;background:#faf5ee;color:#31272a;margin:0;padding:28px}.wrap{max-width:650px;margin:auto}.panel{background:white;border:1px solid #eadbd7;border-radius:22px;padding:25px;box-shadow:0 14px 40px #4d202012}h1{color:#981a30;font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}button{font:inherit;min-height:52px;color:#fff;border:0;border-radius:12px;background:#981a30;cursor:pointer;padding:10px}button:focus-visible{outline:3px solid #daa845}p{line-height:1.6}#now{font-weight:600;color:#981a30;margin:16px 0}</style></head><body><main class="wrap"><section class="panel"><h1>🔊 ทดสอบเสียงแจ้งเตือนร้านพี่ใหญ่</h1><p>กดปุ่มของแต่ละโต๊ะเพื่อฟัง MP3 จริง เสียงจะเล่นจากเครื่องที่เปิดหน้านี้</p><div class="grid"><button type="button" data-table="1">▶ ฟังเสียงโต๊ะ 1</button>
<button type="button" data-table="2">▶ ฟังเสียงโต๊ะ 2</button>
<button type="button" data-table="3">▶ ฟังเสียงโต๊ะ 3</button>
<button type="button" data-table="4">▶ ฟังเสียงโต๊ะ 4</button>
<button type="button" data-table="5">▶ ฟังเสียงโต๊ะ 5</button>
<button type="button" data-table="6">▶ ฟังเสียงโต๊ะ 6</button>
<button type="button" data-table="7">▶ ฟังเสียงโต๊ะ 7</button>
<button type="button" data-table="8">▶ ฟังเสียงโต๊ะ 8</button>
<button type="button" data-table="9">▶ ฟังเสียงโต๊ะ 9</button>
<button type="button" data-table="10">▶ ฟังเสียงโต๊ะ 10</button>
<button type="button" data-table="11">▶ ฟังเสียงโต๊ะ 11</button></div><p id="now" role="status">ยังไม่ได้เลือกโต๊ะ</p><button id="stop" style="background:#555">■ หยุดเสียง</button></section></main><script>let player;document.querySelectorAll('[data-table]').forEach(btn=>btn.onclick=()=>{if(player)player.pause();const n=btn.dataset.table;player=new Audio('sounds/table-'+n+'.mp3');document.getElementById('now').textContent='กำลังเล่นเสียงโต๊ะ '+n;player.onerror=()=>document.getElementById('now').textContent='ไฟล์เสียงโต๊ะ '+n+' โหลดไม่สำเร็จ';player.play().catch(()=>document.getElementById('now').textContent='กรุณาอนุญาตการเล่นเสียง');});document.getElementById('stop').onclick=()=>{if(player)player.pause();document.getElementById('now').textContent='หยุดเสียงแล้ว'};</script></body></html>
